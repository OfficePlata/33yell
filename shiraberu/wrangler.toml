name = "shiraberu"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# ダッシュボードで足した変数を、wrangler deploy で消さない
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# 毎朝 9:00（日本時間）に配信・締切処理
[triggers]
crons = ["0 0 * * *"]

[vars]
COMPANY_NAME = "ささエール（デモ）"
LARK_DOMAIN = "open.larksuite.com"
PUBLIC_URL = "https://shiraberu.a-sasahala.workers.dev"
DEMO_MODE = "true"
# デモ BASE（ささエールの Lark）。導入先では setup-lark.mjs が出す値に置き換える
LARK_BASE_TOKEN = "V80JbyeGpa032ZssOFWjefuHpvp"
# LARK_SURVEY_CHAT_ID / LARK_ADMIN_CHAT_ID / LIFF_ID / LINE_LOGIN_CHANNEL_ID は導入先ごとに設定

# 秘密情報は `wrangler secret put` で登録する（コードに書かない）
#   LARK_APP_ID, LARK_APP_SECRET, LINE_CHANNEL_ACCESS_TOKEN,
#   ANTHROPIC_API_KEY, ADMIN_PASSWORD, LINK_SECRET, ANON_SALT
