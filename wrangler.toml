name = "atsumeru"
main = "src/index.js"
compatibility_date = "2026-09-01"
# ダッシュボードで足した変数を、wrangler deploy で消さない
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# 毎朝 9:00（日本時間）に案内・リマインド・締切の処理
[triggers]
crons = ["0 0 * * *"]

[vars]
CHAPTER_NAME = "BNI デモチャプター"
LARK_DOMAIN = "open.larksuite.com"
PUBLIC_URL = "https://atsumeru.a-sasahala.workers.dev"
# Peatix の申込フォームで、メンバー番号を聞く質問の見出し（CSV の列名に含まれる文字）
MEMBER_NO_LABEL = "メンバー番号"
# デモ BASE（ささエールの Lark）と通知先（テストAI グループ）。導入先では setup-lark.mjs / list-chats.mjs の値に置き換える
LARK_BASE_TOKEN = "QQXCbiPSharfZxsplJhj1Qwvpje"
LARK_ADMIN_CHAT_ID = "oc_b0c14765803deee0ee3af73204a56646"
# LIFF_ID / LINE_LOGIN_CHANNEL_ID は導入先ごとに設定

# 秘密情報は `wrangler secret put` で登録する（コードに書かない）
#   LARK_APP_ID, LARK_APP_SECRET, LINE_CHANNEL_ACCESS_TOKEN, ADMIN_PASSWORD
