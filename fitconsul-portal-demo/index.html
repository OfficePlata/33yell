<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f3a5f" />
  <title>FIT CONSUL 業務ポータル（デモ）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f3a5f'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='700' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface-2: #f7f9fb;
      --line: #e6eaf0;
      --line-strong: #d3d9e2;
      --ink: #16202c;
      --muted: #5a6473;
      --faint: #8a93a0;
      --brand: #0f6fa8;
      --brand-dark: #0f3a5f;
      --brand-tint: #e5f1f9;
      --notion: #191919;
      --ok-bg: #dcfce7; --ok-ink: #15803d;
      --wait-bg: #fef3c7; --wait-ink: #a16207;
      --no-bg: #fee2e2; --no-ink: #b91c1c;
      --info-bg: #e5f1f9; --info-ink: #0f5a8a;
      --gray-bg: #eef0f3; --gray-ink: #4b5563;
      --s1: #2a78d6;  /* 売上 */
      --s2: #eb6834;  /* 原価 */
      --radius: 10px;
      --radius-lg: 16px;
      --shadow: 0 1px 2px rgba(20,28,46,.04), 0 8px 22px rgba(20,28,46,.05);
      --shadow-hover: 0 8px 16px rgba(20,28,46,.08), 0 18px 40px rgba(20,28,46,.10);
      --font: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans",
              "Yu Gothic", "YuGothic", Meiryo, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.65;
           -webkit-font-smoothing: antialiased; }
    a { color: var(--brand); }
    h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
    h2 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 14px; letter-spacing: .06em; }
    .num { font-variant-numeric: tabular-nums; }

    /* ---- demo ribbon ---- */
    .demo-rib { background: var(--brand-dark); color: #dbe9f5; font-size: 12.5px; text-align: center; padding: 6px 16px; }
    .demo-rib b { color: #fff; }

    /* ---- top bar ---- */
    .bar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92);
           -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
           border-bottom: 1px solid var(--line); }
    .bar-in { max-width: 1160px; margin: 0 auto; padding: 11px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; text-decoration: none; color: var(--ink); }
    .brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--brand-dark); color: #fff;
                   display: grid; place-items: center; font-weight: 800; font-size: 15px; }
    .brand .name { font-size: 16px; letter-spacing: .06em; }
    .brand .portal { color: var(--muted); font-weight: 700; font-size: 14px; padding-left: 10px; border-left: 1px solid var(--line-strong); }
    .bar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted);
            background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 8px;
            cursor: pointer; font-family: inherit; }
    .sync:hover { border-color: var(--line-strong); color: var(--ink); }
    .sync .n-logo { width: 18px; height: 18px; border-radius: 4px; background: var(--notion); color: #fff;
                    display: grid; place-items: center; font: 800 11px/1 Georgia, serif; }
    .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }
    .sync.busy .dot { background: #d97706; animation: blink .8s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .role { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line-strong);
            background: var(--surface); color: var(--ink); cursor: pointer; }
    .who { font-size: 13.5px; display: inline-flex; align-items: center; gap: 9px; }
    .av { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0;
          background: var(--brand-tint); color: var(--brand-dark); font-weight: 700; font-size: 13px;
          border: 1px solid color-mix(in srgb, var(--brand) 22%, #fff); }
    .av.sm { width: 26px; height: 26px; font-size: 11.5px; }

    /* ---- nav ---- */
    .nav { max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { display: inline-flex; align-items: center; gap: 7px; padding: 10px 13px; font-size: 13.5px; font-weight: 600;
             color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
    .nav a svg { width: 17px; height: 17px; }
    .nav a:hover { color: var(--ink); }
    .nav a.on { color: var(--brand-dark); border-bottom-color: var(--brand); }

    /* ---- layout ---- */
    .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 24px 40px; }
    .head-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .head-row .sub { color: var(--muted); font-size: 13.5px; }
    .head-row .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

    /* hero */
    .home-top { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; margin-bottom: 18px; }
    .hero { position: relative; overflow: hidden; border-radius: 20px; padding: 30px 32px;
            background: linear-gradient(125deg, #0f3a5f 0%, #0f5a8a 55%, #0f6fa8 100%); color: #fff;
            box-shadow: 0 16px 36px rgba(15,58,95,.25); }
    .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%;
                   background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); }
    .hero .h-greet { font-size: 26px; font-weight: 800; line-height: 1.3; position: relative; }
    .hero .h-sub { font-size: 13.5px; opacity: .88; margin-top: 6px; position: relative; }
    .hero .h-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; position: relative; }
    .hero .h-stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 13px; padding: 11px 14px; }
    .hero .h-stat .k { font-size: 11.5px; opacity: .85; }
    .hero .h-stat .v { font-size: 20px; font-weight: 800; margin-top: 2px; }
    .hero .h-stat .v small { font-size: 12px; font-weight: 600; opacity: .85; margin-left: 2px; }

    .side { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow); }
    .side-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .side-head svg { width: 18px; height: 18px; color: var(--brand); }
    .side-head .t { font-weight: 700; font-size: 14.5px; }
    .side-head .c { margin-left: auto; font-size: 12px; color: var(--muted); }
    .todo { display: flex; flex-direction: column; gap: 8px; }
    .todo a { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
              background: var(--surface-2); text-decoration: none; color: inherit; font-size: 13px; line-height: 1.5; }
    .todo a:hover { border-color: var(--line-strong); background: #fff; }
    .todo .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; flex-shrink: 0; font-size: 12px; font-weight: 800; }
    .todo .ic.no { background: var(--no-bg); color: var(--no-ink); }
    .todo .ic.wait { background: var(--wait-bg); color: var(--wait-ink); }
    .todo .ic.info { background: var(--info-bg); color: var(--info-ink); }
    .todo .s { color: var(--muted); font-size: 12px; }

    /* KPI tiles */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; box-shadow: var(--shadow); }
    .kpi .k { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .kpi .v { font-size: 25px; font-weight: 800; margin-top: 4px; letter-spacing: .01em; }
    .kpi .v small { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 3px; }
    .kpi .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .kpi .d .up { color: var(--ok-ink); font-weight: 700; }
    .kpi .d .down { color: var(--no-ink); font-weight: 700; }

    /* module cards */
    .mod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .mod { --accent: var(--brand); --tint: var(--brand-tint);
           position: relative; display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px 16px 16px 18px;
           background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
           box-shadow: var(--shadow); cursor: pointer; font: inherit; color: inherit; overflow: hidden;
           transition: transform .16s, box-shadow .16s, border-color .16s; }
    .mod::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
    .mod:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    .mod-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--tint); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
    .mod-ico svg { width: 23px; height: 23px; }
    .mod-title { font-weight: 700; font-size: 15px; }
    .mod-desc { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
    .mod-db { font-size: 11px; color: var(--faint); margin-top: 7px; display: inline-flex; align-items: center; gap: 5px; }
    .m-blue   { --accent: #2563eb; --tint: #e8f0fe; }
    .m-amber  { --accent: #d97706; --tint: #fceecf; }
    .m-green  { --accent: #16a34a; --tint: #d9f7e3; }
    .m-violet { --accent: #7c3aed; --tint: #efe7fd; }
    .m-teal   { --accent: #0d9488; --tint: #d2f5f0; }
    .m-rose   { --accent: #e11d48; --tint: #ffe1e8; }
    .m-ink    { --accent: #191919; --tint: #ededec; }

    /* ---- card / form ---- */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
    .stack > * + * { margin-top: 18px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .grid-32 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; }
    .grid-32 > *, .grid2 > *, .home-top > * { min-width: 0; }
    .kpis.k5 { grid-template-columns: repeat(5, 1fr); }
    .kpis.k5 .v { font-size: 20px; }
    .nm-cell { white-space: nowrap; }
    .hero { display: flex; flex-direction: column; }
    .hero .h-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 22px; position: relative; }
    .hero .h-acts a { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none;
                      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 10px; padding: 8px 13px; }
    .hero .h-acts a:hover { background: rgba(255,255,255,.24); }
    .hero .h-acts svg { width: 16px; height: 16px; }
    .hero .h-next { position: relative; margin-top: 18px; font-size: 13px; background: rgba(0,0,0,.14); border-radius: 12px; padding: 12px 14px; }
    .hero .h-next b { font-weight: 800; }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .card-head h2 { margin: 0; }
    .card-head .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .field { margin-bottom: 14px; }
    label.lbl { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
    input[type=text], input[type=number], input[type=date], textarea, select.in {
      width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2);
      border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 9px 12px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
    button:focus-visible, a:focus-visible, .mod:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

    .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
    .seg button { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; background: transparent; border: 0;
                  cursor: pointer; color: var(--muted); }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed=true] { background: var(--brand-dark); color: #fff; }

    .btn { font: inherit; font-size: 13.5px; font-weight: 700; border-radius: var(--radius); padding: 9px 16px;
           border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .btn svg { width: 16px; height: 16px; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(15,111,168,.25); }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
    .btn-ghost:hover { border-color: var(--faint); background: var(--surface-2); }
    .btn-sm { padding: 5px 10px; font-size: 12.5px; }
    .n-link { font-size: 12px; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
              border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; background: var(--surface); white-space: nowrap; }
    .n-link:hover { color: var(--ink); border-color: var(--line-strong); }
    .n-link b { font: 800 11px/1 Georgia, serif; }

    /* pills */
    .pill { font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; display: inline-block; }
    .p-ok { background: var(--ok-bg); color: var(--ok-ink); }
    .p-wait { background: var(--wait-bg); color: var(--wait-ink); }
    .p-no { background: var(--no-bg); color: var(--no-ink); }
    .p-info { background: var(--info-bg); color: var(--info-ink); }
    .p-gray { background: var(--gray-bg); color: var(--gray-ink); }
    .p-violet { background: #efe7fd; color: #6d28d9; }

    /* table (Notion DB 風) */
    .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
    .tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; background: var(--surface-2);
              padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl tr.click { cursor: pointer; }
    .tbl tr.click:hover td { background: #fafbfd; }
    .tbl .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tbl tfoot td { font-weight: 800; background: var(--surface-2); border-top: 1px solid var(--line-strong); }
    .t-title { font-weight: 700; }
    .t-sub { font-size: 11.5px; color: var(--faint); }

    /* kanban */
    .kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 160px; }
    .col.drop { border-color: var(--brand); background: var(--brand-tint); }
    .col-h { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; padding: 2px 4px 10px; }
    .col-h .cnt { color: var(--faint); font-weight: 600; }
    .col-h .sum { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px; margin-bottom: 8px;
             box-shadow: 0 1px 2px rgba(20,28,46,.05); cursor: grab; font-size: 12.5px; }
    .kcard:active { cursor: grabbing; }
    .kcard .kt { font-weight: 700; font-size: 13px; line-height: 1.4; }
    .kcard .kc { color: var(--muted); margin-top: 2px; }
    .kcard .kf { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .kcard .ka { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
    .kcard .next { font: inherit; font-size: 11.5px; border: 1px solid var(--line-strong); background: var(--surface-2);
                   border-radius: 6px; padding: 1px 7px; cursor: pointer; color: var(--muted); }
    .kcard .next:hover { color: var(--brand-dark); border-color: var(--brand); }

    /* progress / budget bars */
    .bar-t { height: 8px; border-radius: 999px; background: var(--gray-bg); overflow: hidden; position: relative; min-width: 80px; }
    .bar-t > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); }
    .bar-t.warn > i { background: #d97706; }
    .bar-t.over > i { background: #dc2626; }
    .prog { display: flex; align-items: center; gap: 8px; }
    .prog .pv { font-size: 12px; font-weight: 700; width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

    /* budget compare (予算 vs 実績 vs 着地見込) */
    .bc { margin: 6px 0 2px; }
    .bc-row { display: grid; grid-template-columns: 76px 1fr 110px; align-items: center; gap: 10px; font-size: 12.5px; margin-bottom: 8px; }
    .bc-row .lb { color: var(--muted); font-weight: 600; }
    .bc-row .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .bc-track { height: 14px; background: var(--gray-bg); border-radius: 4px; position: relative; }
    .bc-track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
    .bc-track .budget-line { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }

    /* chart */
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .grid-l { stroke: var(--line); stroke-width: 1; }
    .chart .ax { fill: var(--muted); font-size: 11px; }
    .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
    .tip { position: absolute; pointer-events: none; background: #11161f; color: #fff; font-size: 12px; line-height: 1.55;
           padding: 8px 11px; border-radius: 9px; box-shadow: 0 8px 22px rgba(0,0,0,.2); opacity: 0; transition: opacity .12s;
           white-space: nowrap; z-index: 5; }
    .tip.show { opacity: 1; }
    .tip b { font-weight: 800; }
    .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

    /* heatmap */
    .heat { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12.5px; min-width: 640px; }
    .heat th { font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 4px 6px; text-align: center; white-space: nowrap; }
    .heat th.nm { text-align: left; }
    .heat td.nm { padding: 4px 8px 4px 0; white-space: nowrap; }
    .heat td.c { text-align: center; border-radius: 6px; padding: 8px 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .heat-legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
    .heat-legend i { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }

    /* timesheet */
    .ts { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
    .ts th { font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; }
    .ts th.pj { text-align: left; }
    .ts td { padding: 7px 5px; border-bottom: 1px solid var(--line); text-align: center; }
    .ts td.pj { text-align: left; min-width: 190px; }
    .ts input { width: 58px; text-align: center; padding: 7px 4px; }
    .ts .we { background: #fafafa; }
    .ts tfoot td { font-weight: 800; }
    .ts .tot { font-weight: 800; font-variant-numeric: tabular-nums; }

    /* project detail */
    .pd-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 16px; font-size: 13px; }
    .pd-meta .k { font-size: 11.5px; color: var(--faint); font-weight: 600; }

    .alert-row { display: flex; align-items: center; gap: 10px; background: var(--no-bg); color: var(--no-ink); border-radius: 11px;

    .foot { max-width: 1160px; margin: 0 auto; padding: 22px 24px 30px; text-align: center; color: var(--faint); font-size: 12px; }

    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);

    @media (max-width: 980px) {

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
