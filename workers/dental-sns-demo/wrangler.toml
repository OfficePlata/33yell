name = "dental-sns-demo"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 秘密情報（コードに書かない）:
#   npx wrangler secret put ANTHROPIC_API_KEY   … AI下書きを有効にする
#   npx wrangler secret put DEMO_PASSCODE       … AI下書きを使う人の合言葉（任意）
[vars]
CLAUDE_MODEL = "claude-sonnet-5-5"
