name = "dental-sns-demo"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/c/*"]

# 秘密情報（コードに書かない）:
#   npx wrangler secret put ANTHROPIC_API_KEY   … AI下書きを有効にする
#   npx wrangler secret put DEMO_PASSCODE       … AI下書きを使う人の合言葉（任意）
[vars]
CLAUDE_MODEL = "claude-opus-5-5"
CLAUDE_EFFORT = "medium"

[[d1_databases]]
binding = "DB"
database_name = "dental-saas-demo"
database_id = "50f69adb-0d9a-4653-bba7-7271f9d48a72"
migrations_dir = "migrations"
