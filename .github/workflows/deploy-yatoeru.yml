name: Deploy ヤトエール LP

# yatoeru/ を Cloudflare Workers（静的アセット、Worker 名 yatoeru）に公開する。
# Pages はアカウントのプロジェクト数上限に達しているため Workers を使う。
# 必要な GitHub Secrets: CLOUDFLARE_API_TOKEN（Workers 編集権限）。CLOUDFLARE_ACCOUNT_ID は任意
on:
  push:
    branches: [main, claude/sasahara-ai-org-chart-54bcbs]
    paths: ["yatoeru/**", ".github/workflows/deploy-yatoeru.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        id: chk
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN が未設定のため、デプロイをスキップしました"
          fi
      - name: Deploy (Cloudflare Workers static assets)
        if: steps.chk.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy --assets yatoeru --name yatoeru --compatibility-date 2026-09-01
